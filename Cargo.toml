[features]
fontawesome = ["rushdown-icons/fontawesome"]

[package]
name = "enclume"
version = "1.0.0"
edition = "2024"
description = "Hit your content on the anvil until a website comes out."
license = "MIT"
repository = "https://github.com/NicolasChagnet/enclume"
keywords = ["ssg", "static-site"]
categories = ["web-programming"]
documentation = "https://docs.rs/enclume"

[dependencies]
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "string"] }
env_logger = "0.11.11"
glob = "0.3.4"
include_dir = "0.7.4"
log = "0.4.34"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rayon = "1.12.0"
regex = "1.13.1"
rushdown = "0.18.0"
rushdown-d2 = "0.1.0"
rushdown-diagram = "0.10.2"
rushdown-emoji = "0.9.8"
rushdown-fenced-div = "0.1.5"
rushdown-footnote = "0.9.8"
rushdown-icons = "0.1.0"
rushdown-relative-links = "0.1.0"
rushdown-toc = "0.1.0"
rushdown-lumis = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = { version = "0.9.2", features = ["alloc"] }
tera = "2.4.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = { version = "1.1.6", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["fs"] }
yaml_serde = "0.10.7"
rushdown-math = "0.1.1"
lumis = { version = "0.17.1", features = ["lang-bundle-full"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
# Young project: keep helpers and getters around until their first consumer lands
dead_code = "allow"
