name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Quality checks
    uses: ./.github/workflows/ci.yml

  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cargo and jq ship with the runner image, so this job skips the setup action.
      - name: Check tag and manifest agree
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v${tag} does not match the Cargo.toml version ${manifest}"
            exit 1
          fi
          echo "version=${manifest}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [ci, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Provides musl-gcc, which the cc crate picks for the musl targets when a
      # dependency builds C code. Pure Rust builds link against the bundled musl.
      - name: Install musl toolchain
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Setup
        uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          archive="enclume-v${VERSION}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" enclume
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: enclume-v*-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*.tar.gz dist/*.sha256
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              dist/*.tar.gz dist/*.sha256
          fi

  crates-io:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    # Trusted publishing: this job exchanges the GitHub OIDC identity for a
    # short-lived crates.io token. Configure it in the crate's crates.io
    # settings as owner/repo <owner>/enclume with the workflow filename
    # "release.yml" (the file that triggers the run) and no environment.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # crates.io requires the crate to exist first, so the first version is
      # published by hand. Skip instead of failing on an existing version.
      # The API rejects requests without a User-Agent.
      - name: Check crates.io
        id: check
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -A "enclume-release-workflow (github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/enclume/${VERSION}")"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "enclume ${VERSION} is already published, skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: steps.check.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  homebrew:
    name: Update Homebrew tap
    needs: [validate, release]
    runs-on: ubuntu-latest
    # Runs once the tap exists: set the HOMEBREW_TAP repository variable to
    # <owner>/homebrew-<name> and the HOMEBREW_TAP_TOKEN secret to a token
    # that can push to that repository.
    if: ${{ vars.HOMEBREW_TAP != '' }}
    steps:
      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --pattern "*.tar.gz.sha256" --dir dist

      - name: Render formula
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          base="${REPO_URL}/releases/download/v${VERSION}"
          sha() { cut -d' ' -f1 "dist/enclume-v${VERSION}-$1.tar.gz.sha256"; }
          mkdir -p tap/Formula
          cat > tap/Formula/enclume.rb <<EOF
          class Enclume < Formula
            desc "A lightweight static site generator"
            homepage "${REPO_URL}"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "${base}/enclume-v${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/enclume-v${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/enclume-v${VERSION}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-musl)"
              end
              on_intel do
                url "${base}/enclume-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "enclume"
            end

            test do
              system bin/"enclume", "init"
              assert_path_exists "src/templates/layout.html"
            end
          end
          EOF

      - name: Push formula
        env:
          TAP: ${{ vars.HOMEBREW_TAP }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap-repo
          mkdir -p tap-repo/Formula
          install -m 644 tap/Formula/enclume.rb tap-repo/Formula/enclume.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/enclume.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "enclume ${VERSION}"
          git push origin HEAD
