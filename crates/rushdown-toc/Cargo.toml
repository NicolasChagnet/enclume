[package]
name = "rushdown-toc"
version = "0.1.0"
edition = "2024"
description = "Collect the headings of a rushdown document into a table of contents."
license = "MIT"
repository = "https://github.com/NicolasChagnet/enclume"

[dependencies]
rushdown = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
